# The Debian package scripts/build-deb.sh makes from this extra.
package=zacos9-extra-hue
name="Hue Lights"
summary="Philips Hue lights in The Collar"
description="Puts Philips Hue rooms and zones in The Collar, ZacOS 9's control
strip: on and off, brightness and scenes, for the rooms you choose."
# The Collar's extension client came in 1.0.4; without it the program runs
# and The Collar simply shows no Hue modules.
depends="zacos9 (>= 1.0.4)"
# mDNS discovery; without it the bridge is found through Philips's service.
recommends="avahi-utils"
# Stopped when the package is removed, so The Collar drops its modules.
programs="zacos9-collar-hue"
