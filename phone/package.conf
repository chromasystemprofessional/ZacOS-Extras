# The Debian package scripts/build-deb.sh makes from this extra.
package=zacos9-extra-phone
name="Phone"
summary="KDE Connect and Syncthing for your phone"
description="Installs KDE Connect and Syncthing, so your phone can share
notifications, files and clipboard, and sync photos with this computer.
Syncthing's web interface opens the first time, to pair the phone."
depends="zacos9 (>= 1.0.4), kdeconnect, syncthing"
recommends="xdg-utils"
programs="zacos9-extra-phone"
