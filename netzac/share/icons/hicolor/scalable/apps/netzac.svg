<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <defs>
    <!-- Authentic 1990s Mac OS 8 2x2 pixel dithering patterns -->
    <pattern id="ditherBlue" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#2255bb"/>
      <rect x="0" y="0" width="1" height="1" fill="#4477dd"/>
      <rect x="1" y="1" width="1" height="1" fill="#113388"/>
    </pattern>
    <pattern id="ditherTeal" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#005555"/>
      <rect x="0" y="0" width="1" height="1" fill="#007777"/>
      <rect x="1" y="1" width="1" height="1" fill="#003333"/>
    </pattern>
    <pattern id="ditherGray" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#cccccc"/>
      <rect x="1" y="0" width="1" height="1" fill="#999999"/>
      <rect x="0" y="1" width="1" height="1" fill="#999999"/>
    </pattern>
    <pattern id="ditherGold" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#cc8833"/>
      <rect x="1" y="0" width="1" height="1" fill="#995511"/>
      <rect x="0" y="1" width="1" height="1" fill="#aa6622"/>
    </pattern>
    <pattern id="ditherRay" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#ffff66"/>
      <rect x="1" y="1" width="1" height="1" fill="#ffff66"/>
    </pattern>
  </defs>

  <!-- 1. Blue Triangle anchored at top-left corner (1,1) covering top-left -->
  <polygon points="1,1 21,1 1,21" fill="url(#ditherBlue)" stroke="#000000" stroke-width="1"/>
  <line x1="2" y1="2" x2="19" y2="2" stroke="#77aaff" stroke-width="1"/>
  <line x1="2" y1="2" x2="2" y2="19" stroke="#77aaff" stroke-width="1"/>

  <!-- Dithered light ray from lighthouse across the sky -->
  <polygon points="22,7 8,4 8,10" fill="url(#ditherRay)"/>

  <!-- 2. Lighthouse on the right, standing on a dithered teal sea/rock base -->
  <polygon points="17,28 30,28 29,25 18,25" fill="url(#ditherTeal)" stroke="#000000" stroke-width="1"/>
  <!-- Tower -->
  <polygon points="21,25 22,10 26,10 27,25" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <!-- Dithered shadow half on right side of tower -->
  <polygon points="24,10.5 25.5,10.5 26.4,24.5 24,24.5" fill="url(#ditherGray)"/>
  <!-- Gallery & Lantern -->
  <rect x="21" y="9" width="6" height="1" fill="#999999" stroke="#000000" stroke-width="1"/>
  <rect x="22" y="6" width="4" height="3" fill="#ffee33" stroke="#000000" stroke-width="1"/>
  <polygon points="21,6 24,2 27,6" fill="#006666" stroke="#000000" stroke-width="1"/>

  <!-- 3. Ship's Wheel (Timão) in bottom-left / center-left foreground -->
  <!-- Spokes (outline then dithered wood) -->
  <g stroke="#000000" stroke-width="3">
    <line x1="11" y1="12" x2="11" y2="30"/>
    <line x1="2" y1="21" x2="20" y2="21"/>
    <line x1="4.5" y1="14.5" x2="17.5" y2="27.5"/>
    <line x1="17.5" y1="14.5" x2="4.5" y2="27.5"/>
  </g>
  <g stroke="#cc8833" stroke-width="1">
    <line x1="11" y1="12" x2="11" y2="30"/>
    <line x1="2" y1="21" x2="20" y2="21"/>
    <line x1="4.5" y1="14.5" x2="17.5" y2="27.5"/>
    <line x1="17.5" y1="14.5" x2="4.5" y2="27.5"/>
  </g>
  <!-- Wheel rim -->
  <circle cx="11" cy="21" r="6" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="11" cy="21" r="6" fill="none" stroke="url(#ditherGold)" stroke-width="1.5"/>
  <!-- Brass center hub -->
  <rect x="9.5" y="19.5" width="3" height="3" fill="#ffcc44" stroke="#000000" stroke-width="1"/>
</svg>
