package=zacos9-extra-phonecamera
name="Phone Camera"
summary="Use an Android phone as a webcam"
description="Streams a chosen camera (front, back, or any camera ID) from an
Android phone to a V4L2 loopback device, so applications can use it as a
webcam. Requires scrcpy and adb; install scrcpy from source if it is not
already available."
depends="zacos9 (>= 1.0.4), adb, v4l2loopback-dkms, v4l2loopback-utils"
recommends="xdg-utils"
programs="zacos9-extra-phonecamera"
