# The Debian package scripts/build-deb.sh makes from this extra.
package=zacos9-extra-gameplayer
name="Game Player"
summary="Play console games in ZacOS 9"
description="Plays NES, Super NES, Sega, Game Boy, Game Boy Advance, PlayStation,\nPlayStation 2, PlayStation 3 and Nintendo 64 games in ZacOS 9: double-click a\ngame file or a PlayStation 3 game folder in the Sniffer (or choose Play from\nGet Info) and it runs in a Platinum-framed window, with a Game Player module\nin The Collar to quit it. The engines are RetroArch, mednafen, PCSX2,\nmupen64plus and RPCS3; installing the extra pulls the Debian ones in.\nGame Player makes ~/Games and gives it its own folder icon; a PlayStation or\nPlayStation 2 BIOS .bin dropped there is moved into place for mednafen or\nPCSX2 automatically. You supply the BIOS and PlayStation 3 firmware; see the\nREADME."
# The Collar's extension client came in 1.0.4. RetroArch, mednafen, PCSX2 and
# mupen64plus come from Debian; ZacOS enables i386 for Wine, so the extra pulls
# Debian's i386 PCSX2 in too. RPCS3 is not in Debian, so it is not a depends.
depends="zacos9 (>= 1.0.4), retroarch, libretro-nestopia, libretro-snes9x, libretro-genesisplusgx, libretro-gambatte, libretro-mgba, mednafen, pcsx2:i386, mupen64plus-ui-console, mupen64plus-video-glide64mk2, mupen64plus-audio-sdl, mupen64plus-input-sdl, mupen64plus-rsp-hle"
# Stopped when the package is removed, so a running game stops with it.
programs="zacos9-gameplayer"