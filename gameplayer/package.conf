# The Debian package scripts/build-deb.sh makes from this extra.
package=zacos9-extra-gameplayer
name="Game Player"
summary="Play console games in ZacOS 9"
description="Plays NES, Super NES, Sega, Game Boy, Game Boy Advance, PlayStation\nand Nintendo 64 cartridges and discs in ZacOS 9: double-click a game file in\nthe Sniffer (or choose Play from Get Info) and it runs in a Platinum-framed\nwindow, with a Game Player module in The Collar to quit it. The engines are\nRetroArch, mednafen and mupen64plus. PlayStation and Nintendo 64 need a\nBIOS or firmware files, which you supply; see the README."
# The Collar's extension client came in 1.0.4. RetroArch and its cores come
# from Debian; PlayStation uses mednafen, Nintendo 64 uses mupen64plus.
depends="zacos9 (>= 1.0.4), retroarch, libretro-nestopia, libretro-snes9x, libretro-genesisplusgx, libretro-gambatte, libretro-mgba, mednafen, mupen64plus-ui-console, mupen64plus-video-glide64mk2, mupen64plus-audio-sdl, mupen64plus-input-sdl, mupen64plus-rsp-hle"
# Stopped when the package is removed, so a running game stops with it.
programs="zacos9-gameplayer"