# The Debian package scripts/build-deb.sh makes from this extra.
package=zacos9-extra-gameplayer
name="Game Player"
summary="Play console games in ZacOS 9"
description="Plays NES, Super NES, Sega, Game Boy, Game Boy Advance, PlayStation,\nPlayStation 2 and Nintendo 64 cartridges and discs in ZacOS 9: double-click a\ngame file in the Sniffer (or choose Play from Get Info) and it runs in a\nPlatinum-framed window, with a Game Player module in The Collar to quit it.\nThe engines are RetroArch, mednafen, PCSX2 and mupen64plus; installing the\nextra pulls them in. Game Player makes ~/Games and gives it its own folder\nicon; a PlayStation or PlayStation 2 BIOS .bin dropped there is moved into\nplace for mednafen or PCSX2 automatically. You supply the BIOS; see the\nREADME."
# The Collar's extension client came in 1.0.4. RetroArch, mednafen and
# mupen64plus come from Debian; PCSX2 is Debian's i386 build, and ZacOS
# enables i386 for Wine, so installing this extra pulls the PS2 engine in
# too.
depends="zacos9 (>= 1.0.4), retroarch, libretro-nestopia, libretro-snes9x, libretro-genesisplusgx, libretro-gambatte, libretro-mgba, mednafen, pcsx2:i386, mupen64plus-ui-console, mupen64plus-video-glide64mk2, mupen64plus-audio-sdl, mupen64plus-input-sdl, mupen64plus-rsp-hle"
# Stopped when the package is removed, so a running game stops with it.
programs="zacos9-gameplayer"