# The Debian package scripts/build-deb.sh makes from this extra.
package=zacos9-extra-frontdesk
name="Front Desk"
summary="A shared-computer launcher for ZacOS 9"
description="Front Desk is a session shell for shared ZacOS 9 accounts: the\nprograms and documents an administrator chooses, with the classic tabbed\npanel. It uses the real Unix accounts and the existing 'Use only chosen\nprograms' allowlist; there is no second user database or password. Front\nDesk Setup chooses the programs and the per-account menus, save location,\nFinder access and speech."
depends="zacos9 (>= 1.18.22)"
recommends="malcontent"
programs="zacos9-frontdesk zacos9-frontdesk-setup"
