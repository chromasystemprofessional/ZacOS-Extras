# The Debian package scripts/build-deb.sh makes from this extra.
package=zacos9-extra-turntable
name="Turntable"
summary="A USB turntable in The Collar"
description="Plays a USB turntable through ZacOS 9's sound output, switched on and
off from The Collar, ZacOS 9's control strip. Left on, it plays again after
logging in or plugging the turntable back in."
# The Collar's extension client came in 1.0.4; pactl talks to PipeWire.
depends="zacos9 (>= 1.0.4), pulseaudio-utils"
# Stopped when the package is removed, which stops the record too.
programs="zacos9-collar-turntable"
